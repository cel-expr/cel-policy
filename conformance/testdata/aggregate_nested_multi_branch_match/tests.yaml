description: Conformance test for multi-branch nested match rule with optional fallback under aggregate
section:
  - name: "basic"
    tests:
      - name: "first_branch_match"
        input:
          cond:
            value: true
          x:
            value: 15
        output:
          value: ["HIGH", "DEFAULT"]
      - name: "second_branch_match"
        input:
          cond:
            value: true
          x:
            value: 5
        output:
          value: ["LOW", "DEFAULT"]
      - name: "nested_fallback_to_empty"
        input:
          cond:
            value: true
          x:
            value: -1
        output:
          value: ["DEFAULT"]
      - name: "outer_condition_false"
        input:
          cond:
            value: false
          x:
            value: 15
        output:
          value: ["DEFAULT"]
